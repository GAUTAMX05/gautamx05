name: GitHub metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/metrics.py --user gautamx05 --out assets
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-calendar-*.svg
          git diff --cached --quiet || (git commit -m "chore: refresh metrics" && git pull --rebase && git push)
